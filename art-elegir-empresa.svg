<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#080c1a"/>
      <stop offset="100%" style="stop-color:#0d1530"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/><line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/><line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/><line x1="600" y1="0" x2="600" y2="400"/>
  </g>
  <!-- Checklist visual -->
  <rect x="80" y="90" width="300" height="200" rx="14" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="230" y="118" text-anchor="middle" font-family="Montserrat,sans-serif" font-weight="800" font-size="12" fill="rgba(255,255,255,0.4)" letter-spacing="2">EMPRESA CORRECTA ✓</text>
  <g font-family="Montserrat,sans-serif" font-size="12" fill="rgba(255,255,255,0.7)">
    <text x="108" y="148"><tspan fill="#22c55e" font-weight="900">✓</tspan>  Garantías reales de fábrica</text>
    <text x="108" y="172"><tspan fill="#22c55e" font-weight="900">✓</tspan>  Equipo técnico propio</text>
    <text x="108" y="196"><tspan fill="#22c55e" font-weight="900">✓</tspan>  Gestiona el medidor</text>
    <text x="108" y="220"><tspan fill="#22c55e" font-weight="900">✓</tspan>  Equipos Tier 1</text>
    <text x="108" y="244"><tspan fill="#22c55e" font-weight="900">✓</tspan>  Monitoreo post-venta</text>
    <text x="108" y="268"><tspan fill="#22c55e" font-weight="900">✓</tspan>  Precio transparente</text>
  </g>
  <!-- X list -->
  <rect x="420" y="90" width="300" height="200" rx="14" fill="rgba(220,38,38,0.05)" stroke="rgba(220,38,38,0.2)" stroke-width="1"/>
  <text x="570" y="118" text-anchor="middle" font-family="Montserrat,sans-serif" font-weight="800" font-size="12" fill="rgba(255,100,100,0.5)" letter-spacing="2">SEÑALES DE ALERTA ✗</text>
  <g font-family="Montserrat,sans-serif" font-size="12" fill="rgba(255,255,255,0.5)">
    <text x="448" y="148"><tspan fill="#ef4444" font-weight="900">✗</tspan>  Precio muy por debajo</text>
    <text x="448" y="172"><tspan fill="#ef4444" font-weight="900">✗</tspan>  Sin garantía escrita</text>
    <text x="448" y="196"><tspan fill="#ef4444" font-weight="900">✗</tspan>  Subcontratan todo</text>
    <text x="448" y="220"><tspan fill="#ef4444" font-weight="900">✗</tspan>  Equipos desconocidos</text>
    <text x="448" y="244"><tspan fill="#ef4444" font-weight="900">✗</tspan>  No dan referencias</text>
    <text x="448" y="268"><tspan fill="#ef4444" font-weight="900">✗</tspan>  Promesas irreales</text>
  </g>
  <!-- Title -->
  <text x="400" y="330" text-anchor="middle" font-family="Montserrat,sans-serif" font-weight="900" font-size="20" fill="white">Cómo elegir una empresa solar</text>
  <text x="400" y="356" text-anchor="middle" font-family="Montserrat,sans-serif" font-weight="400" font-size="13" fill="rgba(255,255,255,0.45)">Las 8 preguntas que debes hacer antes de contratar</text>
  <text x="400" y="388" text-anchor="middle" font-family="Montserrat,sans-serif" font-weight="700" font-size="10" fill="rgba(255,255,255,0.2)" letter-spacing="3">SOLARDEPOT GUATEMALA</text>
</svg>
