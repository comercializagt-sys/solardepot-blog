<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d2137"/>
      <stop offset="100%" style="stop-color:#1a3a5c"/>
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#16a34a"/>
      <stop offset="100%" style="stop-color:#22c55e"/>
    </linearGradient>
    <linearGradient id="red" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#dc2626"/>
      <stop offset="100%" style="stop-color:#ef4444"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <!-- Grid lines -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
  </g>
  <!-- Glow -->
  <ellipse cx="400" cy="200" rx="300" ry="180" fill="rgba(34,197,94,0.07)"/>
  <!-- Top bar -->
  <rect x="60" y="50" width="680" height="4" rx="2" fill="url(#green)" opacity="0.6"/>
  <!-- Coin stack left -->
  <ellipse cx="180" cy="260" rx="60" ry="18" fill="#ca8a04" opacity="0.9"/>
  <rect x="120" y="200" width="120" height="60" fill="#ca8a04" opacity="0.9"/>
  <ellipse cx="180" cy="200" rx="60" ry="18" fill="#fbbf24"/>
  <ellipse cx="180" cy="240" rx="60" ry="18" fill="#ca8a04" opacity="0.9"/>
  <rect x="120" y="180" width="120" height="60" fill="#ca8a04" opacity="0.8"/>
  <ellipse cx="180" cy="180" rx="60" ry="18" fill="#fde68a"/>
  <text x="180" y="185" text-anchor="middle" font-family="Montserrat,sans-serif" font-weight="900" font-size="20" fill="#92400e">Q</text>
  <!-- Arrow -->
  <path d="M280 200 L400 200" stroke="#22c55e" stroke-width="3" stroke-dasharray="8,4"/>
  <polygon points="400,192 416,200 400,208" fill="#22c55e"/>
  <!-- Right savings card -->
  <rect x="420" y="140" width="260" height="130" rx="14" fill="rgba(22,163,74,0.15)" stroke="#22c55e" stroke-width="1.5"/>
  <text x="550" y="175" text-anchor="middle" font-family="Montserrat,sans-serif" font-weight="700" font-size="11" fill="rgba(255,255,255,0.5)" letter-spacing="2">AHORRO MENSUAL</text>
  <text x="550" y="220" text-anchor="middle" font-family="Montserrat,sans-serif" font-weight="900" font-size="44" fill="#22c55e">86%</text>
  <text x="550" y="248" text-anchor="middle" font-family="Montserrat,sans-serif" font-weight="600" font-size="13" fill="rgba(255,255,255,0.5)">menos en tu factura</text>
  <!-- Title -->
  <text x="400" y="326" text-anchor="middle" font-family="Montserrat,sans-serif" font-weight="900" font-size="22" fill="white">¿Cuánto se ahorra con paneles solares?</text>
  <text x="400" y="354" text-anchor="middle" font-family="Montserrat,sans-serif" font-weight="400" font-size="13" fill="rgba(255,255,255,0.45)">Análisis con facturas reales en Guatemala</text>
  <!-- Brand -->
  <text x="400" y="388" text-anchor="middle" font-family="Montserrat,sans-serif" font-weight="700" font-size="10" fill="rgba(255,255,255,0.2)" letter-spacing="3">SOLARDEPOT GUATEMALA</text>
</svg>
