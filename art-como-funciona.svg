<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0c1e3a"/>
      <stop offset="100%" style="stop-color:#0f2d4a"/>
    </linearGradient>
    <linearGradient id="blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2B7BC8"/>
      <stop offset="100%" style="stop-color:#4A9DE0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
  </g>
  <ellipse cx="400" cy="180" rx="280" ry="160" fill="rgba(43,123,200,0.08)"/>
  <!-- Sun -->
  <circle cx="400" cy="110" r="45" fill="rgba(251,191,36,0.15)" stroke="#fbbf24" stroke-width="2"/>
  <circle cx="400" cy="110" r="28" fill="#fbbf24" opacity="0.9"/>
  <!-- Sun rays -->
  <g stroke="#fbbf24" stroke-width="2" opacity="0.5">
    <line x1="400" y1="50" x2="400" y2="38"/>
    <line x1="400" y1="170" x2="400" y2="182"/>
    <line x1="340" y1="110" x2="328" y2="110"/>
    <line x1="460" y1="110" x2="472" y2="110"/>
    <line x1="357" y1="67" x2="349" y2="59"/>
    <line x1="443" y1="153" x2="451" y2="161"/>
    <line x1="443" y1="67" x2="451" y2="59"/>
    <line x1="357" y1="153" x2="349" y2="161"/>
  </g>
  <!-- Flow: Panel → Inversor → Casa -->
  <!-- Panel box -->
  <rect x="60" y="200" width="140" height="80" rx="10" fill="rgba(43,123,200,0.2)" stroke="#2B7BC8" stroke-width="1.5"/>
  <text x="130" y="232" text-anchor="middle" font-family="Montserrat,sans-serif" font-weight="700" font-size="11" fill="rgba(255,255,255,0.5)" letter-spacing="1">PANELES</text>
  <text x="130" y="256" text-anchor="middle" font-family="Montserrat,sans-serif" font-weight="900" font-size="20" fill="#4A9DE0">⬛⬛</text>
  <text x="130" y="272" text-anchor="middle" font-family="Montserrat,sans-serif" font-size="10" fill="rgba(255,255,255,0.35)">Generan DC</text>
  <!-- Arrow 1 -->
  <line x1="200" y1="240" x2="270" y2="240" stroke="#2B7BC8" stroke-width="2" stroke-dasharray="6,3"/>
  <polygon points="270,234 284,240 270,246" fill="#2B7BC8"/>
  <!-- Inversor box -->
  <rect x="284" y="200" width="140" height="80" rx="10" fill="rgba(232,84,26,0.15)" stroke="#E8541A" stroke-width="1.5"/>
  <text x="354" y="232" text-anchor="middle" font-family="Montserrat,sans-serif" font-weight="700" font-size="11" fill="rgba(255,255,255,0.5)" letter-spacing="1">INVERSOR</text>
  <text x="354" y="256" text-anchor="middle" font-family="Montserrat,sans-serif" font-weight="900" font-size="20" fill="#E8541A">⚡</text>
  <text x="354" y="272" text-anchor="middle" font-family="Montserrat,sans-serif" font-size="10" fill="rgba(255,255,255,0.35)">DC → AC</text>
  <!-- Arrow 2 -->
  <line x1="424" y1="240" x2="494" y2="240" stroke="#E8541A" stroke-width="2" stroke-dasharray="6,3"/>
  <polygon points="494,234 508,240 494,246" fill="#E8541A"/>
  <!-- Casa box -->
  <rect x="508" y="200" width="140" height="80" rx="10" fill="rgba(22,163,74,0.15)" stroke="#22c55e" stroke-width="1.5"/>
  <text x="578" y="232" text-anchor="middle" font-family="Montserrat,sans-serif" font-weight="700" font-size="11" fill="rgba(255,255,255,0.5)" letter-spacing="1">TU HOGAR</text>
  <text x="578" y="256" text-anchor="middle" font-family="Montserrat,sans-serif" font-weight="900" font-size="20" fill="#22c55e">🏠</text>
  <text x="578" y="272" text-anchor="middle" font-family="Montserrat,sans-serif" font-size="10" fill="rgba(255,255,255,0.35)">Energía limpia</text>
  <!-- Sun rays to panel -->
  <line x1="370" y1="140" x2="160" y2="200" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="5,4" opacity="0.5"/>
  <!-- Title -->
  <text x="400" y="326" text-anchor="middle" font-family="Montserrat,sans-serif" font-weight="900" font-size="22" fill="white">Cómo funciona un sistema solar</text>
  <text x="400" y="354" text-anchor="middle" font-family="Montserrat,sans-serif" font-weight="400" font-size="13" fill="rgba(255,255,255,0.45)">Del panel al enchufe, explicado paso a paso</text>
  <text x="400" y="388" text-anchor="middle" font-family="Montserrat,sans-serif" font-weight="700" font-size="10" fill="rgba(255,255,255,0.2)" letter-spacing="3">SOLARDEPOT GUATEMALA</text>
</svg>
