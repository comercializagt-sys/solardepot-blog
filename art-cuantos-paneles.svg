<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0e00"/>
      <stop offset="100%" style="stop-color:#2d1f00"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/><line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/><line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/><line x1="600" y1="0" x2="600" y2="400"/>
  </g>
  <ellipse cx="400" cy="200" rx="300" ry="160" fill="rgba(251,191,36,0.06)"/>
  <!-- Panel grid on roof -->
  <g opacity="0.9">
    <!-- Techo -->
    <polygon points="150,230 400,120 650,230" fill="rgba(180,120,60,0.3)" stroke="rgba(180,120,60,0.5)" stroke-width="1.5"/>
    <!-- Paneles sobre el techo -->
    <g fill="rgba(43,123,200,0.7)" stroke="#4A9DE0" stroke-width="1">
      <rect x="220" y="175" width="52" height="36" rx="3" transform="rotate(-22,246,193)"/>
      <rect x="282" y="153" width="52" height="36" rx="3" transform="rotate(-22,308,171)"/>
      <rect x="344" y="131" width="52" height="36" rx="3" transform="rotate(-22,370,149)"/>
      <rect x="406" y="153" width="52" height="36" rx="3" transform="rotate(22,432,171)"/>
      <rect x="468" y="175" width="52" height="36" rx="3" transform="rotate(22,494,193)"/>
    </g>
    <!-- Sol -->
    <circle cx="400" cy="75" r="30" fill="rgba(251,191,36,0.2)" stroke="#fbbf24" stroke-width="1.5"/>
    <circle cx="400" cy="75" r="18" fill="#fbbf24" opacity="0.8"/>
  </g>
  <!-- Formula box -->
  <rect x="100" y="255" width="260" height="70" rx="10" fill="rgba(251,191,36,0.1)" stroke="#fbbf24" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="230" y="280" text-anchor="middle" font-family="Montserrat,sans-serif" font-weight="700" font-size="11" fill="rgba(255,255,255,0.4)" letter-spacing="1">FÓRMULA</text>
  <text x="230" y="308" text-anchor="middle" font-family="Montserrat,sans-serif" font-weight="800" font-size="14" fill="#fbbf24">kWh ÷ 125 = kWp</text>
  <!-- Result box -->
  <rect x="440" y="255" width="260" height="70" rx="10" fill="rgba(232,84,26,0.1)" stroke="#E8541A" stroke-width="1"/>
  <text x="570" y="280" text-anchor="middle" font-family="Montserrat,sans-serif" font-weight="700" font-size="11" fill="rgba(255,255,255,0.4)" letter-spacing="1">EJEMPLO: 350 kWh</text>
  <text x="570" y="308" text-anchor="middle" font-family="Montserrat,sans-serif" font-weight="900" font-size="18" fill="#E8541A">≈ 5 paneles de 645W</text>
  <!-- Title -->
  <text x="400" y="358" text-anchor="middle" font-family="Montserrat,sans-serif" font-weight="900" font-size="20" fill="white">¿Cuántos paneles necesita tu casa?</text>
  <text x="400" y="388" text-anchor="middle" font-family="Montserrat,sans-serif" font-weight="700" font-size="10" fill="rgba(255,255,255,0.2)" letter-spacing="3">SOLARDEPOT GUATEMALA</text>
</svg>
