<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1f0a"/>
      <stop offset="100%" style="stop-color:#0d2e0d"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/><line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/><line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/><line x1="600" y1="0" x2="600" y2="400"/>
  </g>
  <!-- Avatar familia -->
  <circle cx="200" cy="160" r="55" fill="rgba(22,163,74,0.15)" stroke="#16a34a" stroke-width="2"/>
  <text x="200" y="148" text-anchor="middle" font-family="sans-serif" font-size="36">👨‍👩‍👧</text>
  <text x="200" y="185" text-anchor="middle" font-family="Montserrat,sans-serif" font-weight="700" font-size="11" fill="rgba(255,255,255,0.6)">Familia</text>
  <text x="200" y="200" text-anchor="middle" font-family="Montserrat,sans-serif" font-weight="700" font-size="11" fill="rgba(255,255,255,0.6)">en Fraijanes</text>
  <!-- Antes -->
  <rect x="300" y="110" width="160" height="100" rx="10" fill="rgba(220,38,38,0.1)" stroke="#dc2626" stroke-width="1.5"/>
  <text x="380" y="138" text-anchor="middle" font-family="Montserrat,sans-serif" font-weight="700" font-size="10" fill="rgba(255,255,255,0.4)" letter-spacing="2">ANTES</text>
  <text x="380" y="172" text-anchor="middle" font-family="Montserrat,sans-serif" font-weight="900" font-size="32" fill="#ef4444">Q1,800</text>
  <text x="380" y="196" text-anchor="middle" font-family="Montserrat,sans-serif" font-size="11" fill="rgba(255,255,255,0.35)">factura mensual</text>
  <!-- Flecha -->
  <text x="480" y="168" text-anchor="middle" font-family="Montserrat,sans-serif" font-size="28" fill="#22c55e">→</text>
  <!-- Después -->
  <rect x="500" y="110" width="200" height="100" rx="10" fill="rgba(22,163,74,0.15)" stroke="#16a34a" stroke-width="2"/>
  <text x="600" y="138" text-anchor="middle" font-family="Montserrat,sans-serif" font-weight="700" font-size="10" fill="rgba(255,255,255,0.4)" letter-spacing="2">CON SOLAR</text>
  <text x="600" y="172" text-anchor="middle" font-family="Montserrat,sans-serif" font-weight="900" font-size="32" fill="#22c55e">Q850</text>
  <text x="600" y="196" text-anchor="middle" font-family="Montserrat,sans-serif" font-size="11" fill="rgba(255,255,255,0.35)">ahorro mensual</text>
  <!-- Stats row -->
  <rect x="100" y="240" width="600" height="55" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="230" y="262" text-anchor="middle" font-family="Montserrat,sans-serif" font-weight="900" font-size="20" fill="#fbbf24">7.9 kW</text>
  <text x="230" y="282" text-anchor="middle" font-family="Montserrat,sans-serif" font-size="10" fill="rgba(255,255,255,0.35)">Sistema instalado</text>
  <line x1="360" y1="248" x2="360" y2="288" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="450" y="262" text-anchor="middle" font-family="Montserrat,sans-serif" font-weight="900" font-size="20" fill="#22c55e">Q10,200</text>
  <text x="450" y="282" text-anchor="middle" font-family="Montserrat,sans-serif" font-size="10" fill="rgba(255,255,255,0.35)">Ahorro anual</text>
  <line x1="560" y1="248" x2="560" y2="288" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="640" y="262" text-anchor="middle" font-family="Montserrat,sans-serif" font-weight="900" font-size="20" fill="#4A9DE0">2.7 años</text>
  <text x="640" y="282" text-anchor="middle" font-family="Montserrat,sans-serif" font-size="10" fill="rgba(255,255,255,0.35)">Recupero</text>
  <!-- Title -->
  <text x="400" y="334" text-anchor="middle" font-family="Montserrat,sans-serif" font-weight="900" font-size="20" fill="white">Caso real: familia en Fraijanes</text>
  <text x="400" y="358" text-anchor="middle" font-family="Montserrat,sans-serif" font-weight="400" font-size="13" fill="rgba(255,255,255,0.45)">Ahorro de Q850/mes · Sistema 7.9 kW</text>
  <text x="400" y="388" text-anchor="middle" font-family="Montserrat,sans-serif" font-weight="700" font-size="10" fill="rgba(255,255,255,0.2)" letter-spacing="3">SOLARDEPOT GUATEMALA</text>
</svg>
