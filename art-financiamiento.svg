<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f1f0f"/>
      <stop offset="100%" style="stop-color:#1a3020"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/><line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/><line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/><line x1="600" y1="0" x2="600" y2="400"/>
  </g>
  <ellipse cx="400" cy="200" rx="300" ry="160" fill="rgba(22,163,74,0.06)"/>
  <!-- Tarjeta banco -->
  <rect x="80" y="120" width="280" height="170" rx="16" fill="rgba(22,163,74,0.12)" stroke="#16a34a" stroke-width="1.5"/>
  <rect x="80" y="120" width="280" height="50" rx="16" fill="rgba(22,163,74,0.2)"/>
  <rect x="80" y="154" width="280" height="16" fill="rgba(22,163,74,0.2)"/>
  <text x="220" y="152" text-anchor="middle" font-family="Montserrat,sans-serif" font-weight="800" font-size="14" fill="white">NEOCUOTAS</text>
  <text x="108" y="195" font-family="Montserrat,sans-serif" font-weight="700" font-size="11" fill="rgba(255,255,255,0.4)" letter-spacing="2">ENGANCHE</text>
  <text x="108" y="220" font-family="Montserrat,sans-serif" font-weight="900" font-size="36" fill="#22c55e">Q0</text>
  <text x="108" y="244" font-family="Montserrat,sans-serif" font-weight="600" font-size="12" fill="rgba(255,255,255,0.5)">Sin recargo · 0%</text>
  <text x="108" y="272" font-family="Montserrat,sans-serif" font-weight="700" font-size="11" fill="rgba(255,255,255,0.3)">24 · 36 · 48 cuotas</text>
  <!-- Cuota card derecha -->
  <rect x="420" y="120" width="300" height="170" rx="16" fill="rgba(43,123,200,0.1)" stroke="#2B7BC8" stroke-width="1.5"/>
  <text x="570" y="165" text-anchor="middle" font-family="Montserrat,sans-serif" font-weight="700" font-size="11" fill="rgba(255,255,255,0.4)" letter-spacing="2">TU CUOTA VS TU LUZ</text>
  <!-- Barra luz -->
  <text x="440" y="198" font-family="Montserrat,sans-serif" font-size="11" fill="rgba(255,255,255,0.4)">Factura actual</text>
  <rect x="440" y="204" width="200" height="18" rx="4" fill="rgba(220,38,38,0.3)" stroke="#dc2626" stroke-width="1"/>
  <rect x="440" y="204" width="200" height="18" rx="4" fill="rgba(220,38,38,0.5)"/>
  <text x="650" y="218" font-family="Montserrat,sans-serif" font-weight="700" font-size="11" fill="#ef4444">Q900</text>
  <!-- Barra cuota -->
  <text x="440" y="242" font-family="Montserrat,sans-serif" font-size="11" fill="rgba(255,255,255,0.4)">Cuota solar</text>
  <rect x="440" y="248" width="130" height="18" rx="4" fill="rgba(22,163,74,0.5)"/>
  <text x="580" y="262" font-family="Montserrat,sans-serif" font-weight="700" font-size="11" fill="#22c55e">Q580 ✓</text>
  <text x="570" y="286" text-anchor="middle" font-family="Montserrat,sans-serif" font-weight="800" font-size="13" fill="#22c55e">Ahorras desde el mes 1</text>
  <!-- Title -->
  <text x="400" y="326" text-anchor="middle" font-family="Montserrat,sans-serif" font-weight="900" font-size="21" fill="white">Cómo financiar paneles solares</text>
  <text x="400" y="350" text-anchor="middle" font-family="Montserrat,sans-serif" font-weight="400" font-size="13" fill="rgba(255,255,255,0.45)">Sin enganche · Sin recargo · Ahorro desde el día 1</text>
  <text x="400" y="388" text-anchor="middle" font-family="Montserrat,sans-serif" font-weight="700" font-size="10" fill="rgba(255,255,255,0.2)" letter-spacing="3">SOLARDEPOT GUATEMALA</text>
